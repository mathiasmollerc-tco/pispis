<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PisPish Lost in the Space</title>


<style>

/* =========================================
   CONFIGURACIÓN GENERAL
========================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #080817;

    color: white;

    font-family:
        "Courier New",
        monospace;

    overflow: hidden;

    text-align: center;
}


/* =========================================
   TITULO
========================================= */

h1 {

    margin:
        12px 0 5px;

    font-size: 30px;

    letter-spacing: 2px;

    color: #42e8ff;

    text-shadow:

        3px 3px 0 #172080,

        0 0 12px #00d9ff;
}


/* =========================================
   HUD
========================================= */

#info {

    width: 900px;

    max-width: 95vw;

    margin: 8px auto;

    padding: 8px;

    background: #11152e;

    border:
        3px solid #42e8ff;

    box-shadow:
        0 0 12px #007cff;

    font-size: 19px;

    font-weight: bold;
}


/* BARRA DE ENERGÍA */

.energy-container {

    display: inline-block;

    width: 180px;

    height: 16px;

    margin-left: 8px;

    background: #222;

    border:
        2px solid white;

    vertical-align: middle;
}


#energy {

    display: block;

    width: 100%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #00ff66,
            #d9ff00
        );

    transition:
        width .2s;
}


/* =========================================
   ESCENARIO
========================================= */

#game {

    position: relative;

    width: 900px;

    max-width: 95vw;

    height: 520px;

    margin: auto;

    overflow: hidden;

    border:
        5px solid #3f5cff;


    background:

        radial-gradient(
            circle at 20% 20%,
            white 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 80% 30%,
            white 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 40% 70%,
            white 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 60% 90%,
            white 1px,
            transparent 2px
        ),

        linear-gradient(
            #08052c,
            #11145b 65%,
            #17172c 65%
        );


    background-size:

        140px 140px,

        190px 190px,

        230px 230px,

        270px 270px,

        cover;
}


/* =========================================
   LUNA
========================================= */

#moon {

    position: absolute;

    right: 90px;

    top: 45px;

    width: 120px;

    height: 120px;

    border-radius: 50%;


    background:

        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #a9c7ff 50%,
            #405080
        );


    box-shadow:

        0 0 30px #739aff;
}


/* =========================================
   PLATAFORMAS
========================================= */

.platform {

    position: absolute;

    height: 22px;

    background:

        linear-gradient(
            #4d607f,
            #17233d
        );

    border-top:
        4px solid #7da9ff;

    box-shadow:
        0 5px 0 #080b19;
}


#platform1 {

    left: 0;

    bottom: 45px;

    width: 100%;
}


#platform2 {

    left: 280px;

    bottom: 170px;

    width: 180px;
}


#platform3 {

    right: 70px;

    bottom: 230px;

    width: 160px;
}


/* =========================================
   GATO
========================================= */

#cat {

    position: absolute;

    left: 65px;

    bottom: 65px;

    width: 90px;

    height: 90px;

    object-fit: cover;

    border-radius: 8px;

    border:
        4px solid #ff9d00;

    cursor: pointer;

    user-select: none;


    box-shadow:

        0 0 8px #ff9d00,

        0 0 20px #ff6500;


    z-index: 5;
}


/* =========================================
   BOYERO DE BERNA
========================================= */

#dog {

    position: absolute;

    right: 70px;

    bottom: 65px;

    width: 130px;

    height: 130px;

    object-fit: cover;

    border-radius: 8px;

    border:
        4px solid #ffcf70;


    box-shadow:

        0 0 10px #ffb83d;


    transition:

        transform .12s,

        filter .12s;


    z-index: 5;
}


/* =========================================
   PROYECTIL
========================================= */

.shot {

    position: absolute;

    width: 65px;

    height: 65px;

    object-fit: cover;

    border-radius: 8px;


    border:
        3px solid #ffae00;


    box-shadow:

        0 0 8px #ffae00,

        0 0 20px #ff5500;


    z-index: 20;
}


/* =========================================
   EFECTO HIT
========================================= */

.hit-effect {

    position: absolute;

    font-size: 38px;

    font-weight: bold;

    color: #ffe600;


    text-shadow:

        3px 3px 0 #ff4a00,

        0 0 10px white;


    z-index: 30;


    animation:

        hitAnimation
        .35s
        forwards;
}


@keyframes hitAnimation {

    0% {

        transform:
            scale(.5);

        opacity: 1;
    }


    100% {

        transform:

            scale(1.5)

            translateY(-30px);

        opacity: 0;
    }
}


/* =========================================
   MENSAJE FINAL
========================================= */

#message {

    position: absolute;

    width: 100%;

    top: 38%;

    display: none;

    font-size: 38px;

    font-weight: bold;

    color: white;


    text-shadow:

        4px 4px 0 #273cff,

        0 0 15px #00d9ff;


    z-index: 50;
}


/* =========================================
   CONTROLES
========================================= */

#controls {

    margin-top: 8px;

    color: #8feaff;

    font-size: 14px;

    font-weight: bold;
}


/* =========================================
   BOTÓN
========================================= */

button {

    margin-top: 10px;

    padding:
        10px 28px;


    background: #202b72;

    color: white;


    border:
        3px solid #55dfff;


    font-family:
        "Courier New",
        monospace;


    font-weight: bold;

    cursor: pointer;


    box-shadow:

        0 0 10px #006eff;
}


button:hover {

    background: #3547a8;


    box-shadow:

        0 0 20px #00c8ff;
}

</style>

</head>


<body>


<!-- =====================================
     TITULO
===================================== -->

<h1>

    🚀 PISPISH LOST IN THE SPACE 🚀

</h1>


<!-- =====================================
     HUD
===================================== -->

<div id="info">

    SHOTS:

    <span id="shots">
        0
    </span>

    /13


    &nbsp;&nbsp;


    HITS:

    <span id="hits">
        0
    </span>

    /13


    &nbsp;&nbsp;


    ENERGY:


    <span
        class="energy-container"
    >

        <span
            id="energy"
        ></span>

    </span>

</div>


<!-- =====================================
     ESCENARIO
===================================== -->

<div id="game">


    <!-- LUNA -->

    <div id="moon"></div>


    <!-- PLATAFORMAS -->

    <div
        id="platform1"
        class="platform"
    ></div>


    <div
        id="platform2"
        class="platform"
    ></div>


    <div
        id="platform3"
        class="platform"
    ></div>


    <!-- GATO -->

    <img

        id="cat"

        src="gato.jpg"

        alt="Gato"

    >


    <!-- BOYERO -->

    <img

        id="dog"

        src="Perro.jpg"

        alt="Boyero de Berna"

    >


    <!-- MENSAJE -->

    <div
        id="message"
    ></div>


</div>


<!-- =====================================
     CONTROLES
===================================== -->

<div id="controls">

    ⬅️ ➡️ MOVER &nbsp;&nbsp;

    ⬆️ ⬇️ VOLAR &nbsp;&nbsp;

    🚀 ESPACIO = DISPARAR

</div>


<!-- =====================================
     BOTÓN
===================================== -->

<button
    onclick="restart()"
>

    ↻ RESTART

</button>


<script>


/* =========================================
   ELEMENTOS
========================================= */

const game =
    document.getElementById(
        "game"
    );


const cat =
    document.getElementById(
        "cat"
    );


const dog =
    document.getElementById(
        "dog"
    );


const shotsText =
    document.getElementById(
        "shots"
    );


const hitsText =
    document.getElementById(
        "hits"
    );


const energy =
    document.getElementById(
        "energy"
    );


/* =========================================
   VARIABLES DEL JUEGO
========================================= */

let shots = 0;

let hits = 0;

let gameOver = false;


/* =========================================
   POSICIÓN DEL GATO
========================================= */

let catX = 65;

let catY = 65;


/* VELOCIDAD */

const catSpeed = 5;


/* =========================================
   TECLAS
========================================= */

const keys = {};


document.addEventListener(
    "keydown",
    function(event) {


        keys[event.key] = true;


        /*
        Evitar scroll
        */

        if (

            event.key ===
                "ArrowUp" ||

            event.key ===
                "ArrowDown" ||

            event.key ===
                "ArrowLeft" ||

            event.key ===
                "ArrowRight" ||

            event.key ===
                " "

        ) {

            event.preventDefault();

        }


        /*
        ESPACIO = DISPARAR
        */

        if (

            event.key === " " &&

            !event.repeat

        ) {

            shoot();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key] = false;

    }
);


/* =========================================
   MOVIMIENTO DEL GATO
========================================= */

function moveCat() {


    if (gameOver)
        return;


    /*
    IZQUIERDA
    */

    if (
        keys["ArrowLeft"]
    ) {

        catX -=
            catSpeed;

    }


    /*
    DERECHA
    */

    if (
        keys["ArrowRight"]
    ) {

        catX +=
            catSpeed;

    }


    /*
    ARRIBA
    */

    if (
        keys["ArrowUp"]
    ) {

        catY +=
            catSpeed;

    }


    /*
    ABAJO
    */

    if (
        keys["ArrowDown"]
    ) {

        catY -=
            catSpeed;

    }


    /*
    LÍMITES HORIZONTALES
    */

    const maxX =

        game.clientWidth -

        cat.offsetWidth;


    if (
        catX < 0
    ) {

        catX = 0;

    }


    if (
        catX > maxX
    ) {

        catX = maxX;

    }


    /*
    LÍMITES VERTICALES
    */

    const maxY =

        game.clientHeight -

        cat.offsetHeight -

        45;


    if (
        catY < 45
    ) {

        catY = 45;

    }


    if (
        catY > maxY
    ) {

        catY = maxY;

    }


    /*
    APLICAR POSICIÓN
    */

    cat.style.left =
        catX + "px";


    cat.style.bottom =
        catY + "px";


    /*
    SIGUIENTE FRAME
    */

    requestAnimationFrame(
        moveCat
    );
}


/* =========================================
   MOVIMIENTO DEL PERRO
========================================= */

let dogX = 70;

let dogDirection = -1;

let dogSpeed = 2.2;


function moveDog() {


    if (gameOver)
        return;


    dogX +=

        dogDirection *

        dogSpeed;


    /*
    LÍMITE IZQUIERDO
    */

    if (
        dogX < 30
    ) {

        dogDirection = 1;

    }


    /*
    LÍMITE DERECHO
    */

    if (
        dogX > 300
    ) {

        dogDirection = -1;

    }


    dog.style.right =
        dogX + "px";


    requestAnimationFrame(
        moveDog
    );
}


/* =========================================
   INICIAR MOVIMIENTO
========================================= */

moveCat();

moveDog();


/* =========================================
   DISPARAR
========================================= */

function shoot() {


    /*
    MÁXIMO 13 TIROS
    */

    if (

        gameOver ||

        shots >= 13

    ) {

        return;

    }


    /*
    SUMAR DISPARO
    */

    shots++;


    shotsText.textContent =
        shots;


    /*
    CREAR PROYECTIL
    */

    const projectile =

        document.createElement(
            "img"
        );


    projectile.className =
        "shot";


    /*
    USAR LA MISMA IMAGEN
    DEL GATO
    */

    projectile.src =
        "gato.jpg";


    /*
    POSICIÓN INICIAL
    */

    let x =

        cat.offsetLeft +

        cat.offsetWidth;


    let y =

        cat.offsetTop + 10;


    projectile.style.left =
        x + "px";


    projectile.style.top =
        y + "px";


    game.appendChild(
        projectile
    );


    /*
    MOVIMIENTO DEL PROYECTIL
    */

    const interval =

        setInterval(
            () => {


                x += 14;


                projectile.style.left =
                    x + "px";


                /*
                POSICIÓN DEL PERRO
                */

                const dogLeft =

                    dog.offsetLeft;


                const dogRight =

                    dogLeft +

                    dog.offsetWidth;


                const dogTop =

                    dog.offsetTop;


                const dogBottom =

                    dogTop +

                    dog.offsetHeight;


                /*
                POSICIÓN DEL PROYECTIL
                */

                const shotTop =

                    projectile.offsetTop;


                const shotBottom =

                    shotTop +

                    projectile.offsetHeight;


                /*
                DETECTAR COLISIÓN
                */

                if (

                    x + 65 >=
                        dogLeft &&

                    x <=
                        dogRight &&

                    shotBottom >=
                        dogTop &&

                    shotTop <=
                        dogBottom

                ) {


                    /*
                    DETENER PROYECTIL
                    */

                    clearInterval(
                        interval
                    );


                    projectile.remove();


                    /*
                    SUMAR IMPACTO
                    */

                    hits++;


                    hitsText.textContent =
                        hits;


                    /*
                    ACTUALIZAR ENERGÍA
                    */

                    const energyValue =

                        100 -

                        (
                            hits / 13
                        ) * 100;


                    energy.style.width =

                        energyValue +
                        "%";


                    /*
                    ANIMACIÓN DEL PERRO
                    */

                    dog.style.transform =

                        "translateX(8px) rotate(5deg)";


                    dog.style.filter =

                        "brightness(1.8)";


                    /*
                    TEXTO HIT
                    */

                    const effect =

                        document.createElement(
                            "div"
                        );


                    effect.className =
                        "hit-effect";


                    effect.textContent =
                        "HIT!";


                    effect.style.left =

                        dogLeft +
                        "px";


                    effect.style.top =

                        dogTop -
                        30 +
                        "px";


                    game.appendChild(
                        effect
                    );


                    /*
                    ELIMINAR EFECTO
                    */

                    setTimeout(
                        () => {

                            effect.remove();

                        },
                        350
                    );


                    /*
                    RESTAURAR PERRO
                    */

                    setTimeout(
                        () => {

                            dog.style.transform =
                                "translateX(0) rotate(0)";

                            dog.style.filter =
                                "brightness(1)";

                        },
                        150
                    );


                    /*
                    VICTORIA
                    */

                    if (
                        hits >= 13
                    ) {

                        endGame(
                            true
                        );

                    }


                    return;

                }


                /*
                PROYECTIL SALE
                */

                if (

                    x >
                    game.clientWidth

                ) {


                    clearInterval(
                        interval
                    );


                    projectile.remove();


                    /*
                    GAME OVER
                    */

                    if (

                        shots >= 13 &&

                        hits < 13

                    ) {

                        endGame(
                            false
                        );

                    }

                }

            },

            30
        );

}


/* =========================================
   FINAL DEL JUEGO
========================================= */

function endGame(
    won
) {


    gameOver = true;


    const message =

        document.getElementById(
            "message"
        );


    message.style.display =
        "block";


    /*
    GANÓ
    */

    if (won) {


        message.innerHTML =

            "★ STAGE CLEAR ★" +

            "<br>" +

            "<small>" +

            "PISPISH WINS!" +

            "</small>";

    }


    /*
    PERDIÓ
    */

    else {


        message.innerHTML =

            "GAME OVER" +

            "<br>" +

            "<small>" +

            "13 SHOTS USED" +

            "</small>";

    }

}


/* =========================================
   REINICIAR
========================================= */

function restart() {

    location.reload();

}

</script>

</body>

</html>
