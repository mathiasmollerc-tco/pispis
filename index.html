<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>PisPish Lost in the Space</title>


<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    background: #080817;

    color: white;

    font-family: "Courier New", monospace;

    overflow: hidden;

    text-align: center;

    touch-action: none;
}


/* =====================================================
   TITULO
===================================================== */

h1 {

    margin: 8px 0 4px;

    font-size: clamp(20px, 4vw, 30px);

    letter-spacing: 2px;

    color: #42e8ff;

    text-shadow:
        3px 3px 0 #172080,
        0 0 12px #00d9ff;
}


/* =====================================================
   HUD
===================================================== */

#info {

    width: 900px;

    max-width: 96vw;

    margin: 5px auto;

    padding: 7px;

    background: #11152e;

    border: 3px solid #42e8ff;

    box-shadow: 0 0 12px #007cff;

    font-size: clamp(12px, 2.5vw, 18px);

    font-weight: bold;

}


/* =====================================================
   BARRA DE ENERGÍA
===================================================== */

.energy-container {

    display: inline-block;

    width: 130px;

    max-width: 22vw;

    height: 14px;

    margin-left: 5px;

    background: #222;

    border: 2px solid white;

    vertical-align: middle;
}


#energy {

    display: block;

    width: 100%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #00ff66,
            #d9ff00
        );

    transition: width .2s;
}


/* =====================================================
   ESCENARIO
===================================================== */

#game {

    position: relative;

    width: 900px;

    max-width: 96vw;

    height: min(520px, 65vh);

    min-height: 350px;

    margin: auto;

    overflow: hidden;

    border: 5px solid #3f5cff;

    background:

        radial-gradient(
            circle at 20% 20%,
            white 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 80% 30%,
            white 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 40% 70%,
            white 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 60% 90%,
            white 1px,
            transparent 2px
        ),

        linear-gradient(
            #08052c,
            #11145b 65%,
            #17172c 65%
        );

    background-size:
        140px 140px,
        190px 190px,
        230px 230px,
        270px 270px,
        cover;
}


/* =====================================================
   LUNA
===================================================== */

#moon {

    position: absolute;

    right: 10%;

    top: 8%;

    width: 100px;

    height: 100px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #a9c7ff 50%,
            #405080
        );

    box-shadow:
        0 0 30px #739aff;
}


/* =====================================================
   PLATAFORMAS
===================================================== */

.platform {

    position: absolute;

    height: 22px;

    background:
        linear-gradient(
            #4d607f,
            #17233d
        );

    border-top: 4px solid #7da9ff;

    box-shadow:
        0 5px 0 #080b19;
}


#platform1 {

    left: 0;

    bottom: 45px;

    width: 100%;
}


#platform2 {

    left: 31%;

    bottom: 170px;

    width: 180px;
}


#platform3 {

    right: 8%;

    bottom: 230px;

    width: 160px;
}


/* =====================================================
   GATO
===================================================== */

#cat {

    position: absolute;

    left: 65px;

    bottom: 65px;

    width: 90px;

    height: 90px;

    object-fit: cover;

    border-radius: 8px;

    border: 4px solid #ff9d00;

    user-select: none;

    -webkit-user-drag: none;

    box-shadow:
        0 0 8px #ff9d00,
        0 0 20px #ff6500;

    z-index: 5;

    transition:
        filter .1s,
        transform .1s;
}


/* =====================================================
   PERRO
===================================================== */

#dog {

    position: absolute;

    right: 70px;

    bottom: 65px;

    width: 130px;

    height: 130px;

    object-fit: cover;

    border-radius: 8px;

    border: 4px solid #ffcf70;

    box-shadow:
        0 0 10px #ffb83d;

    transition:
        transform .12s,
        filter .12s;

    z-index: 5;
}


/* =====================================================
   PROYECTIL
===================================================== */

.shot {

    position: absolute;

    width: 65px;

    height: 65px;

    object-fit: cover;

    border-radius: 8px;

    border: 3px solid #ffae00;

    box-shadow:
        0 0 8px #ffae00,
        0 0 20px #ff5500;

    z-index: 20;
}


/* =====================================================
   HIT
===================================================== */

.hit-effect {

    position: absolute;

    font-size: 38px;

    font-weight: bold;

    color: #ffe600;

    text-shadow:
        3px 3px 0 #ff4a00,
        0 0 10px white;

    z-index: 30;

    animation:
        hitAnimation .35s forwards;
}


@keyframes hitAnimation {

    0% {

        transform: scale(.5);

        opacity: 1;
    }

    100% {

        transform:
            scale(1.5)
            translateY(-30px);

        opacity: 0;
    }
}


/* =====================================================
   EFECTO DAÑO AL GATO
===================================================== */

.damage-effect {

    position: absolute;

    font-size: 32px;

    font-weight: bold;

    color: #ff4444;

    text-shadow:
        2px 2px 0 #500000,
        0 0 10px white;

    z-index: 30;

    animation:
        damageAnimation .6s forwards;
}


@keyframes damageAnimation {

    0% {

        transform:
            scale(.5);

        opacity: 1;
    }

    100% {

        transform:
            scale(1.4)
            translateY(-35px);

        opacity: 0;
    }
}


/* =====================================================
   MENSAJE FINAL
===================================================== */

#message {

    position: absolute;

    width: 100%;

    top: 38%;

    display: none;

    font-size: clamp(25px, 7vw, 42px);

    font-weight: bold;

    color: white;

    text-shadow:
        4px 4px 0 #273cff,
        0 0 15px #00d9ff;

    z-index: 50;
}


/* =====================================================
   CONTROLES PC
===================================================== */

#controls {

    margin-top: 6px;

    color: #8feaff;

    font-size: 13px;

    font-weight: bold;
}


/* =====================================================
   CONTROLES TÁCTILES
===================================================== */

#mobileControls {

    display: none;

    position: fixed;

    left: 0;

    right: 0;

    bottom: 8px;

    z-index: 100;

    pointer-events: none;
}


.control-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    width: 100%;

    padding: 0 18px;
}


/* =====================================================
   PAD DIRECCIONAL
===================================================== */

.direction-pad {

    display: grid;

    grid-template-columns:
        55px 55px 55px;

    grid-template-rows:
        55px 55px;

    gap: 5px;

    pointer-events: auto;
}


#up {

    grid-column: 2;
}


#left {

    grid-column: 1;

    grid-row: 2;
}


#down {

    grid-column: 2;

    grid-row: 2;
}


#right {

    grid-column: 3;

    grid-row: 2;
}


/* =====================================================
   BOTÓN FIRE
===================================================== */

#fire {

    width: 105px;

    height: 105px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #ff5b35,
            #9b1700
        );

    border: 4px solid #ffcf70;

    color: white;

    font-size: 20px;

    font-family:
        "Courier New",
        monospace;

    font-weight: bold;

    box-shadow:
        0 0 15px #ff4200,
        inset 0 0 15px #ffb000;

    pointer-events: auto;

    user-select: none;

    touch-action: none;
}


/* =====================================================
   BOTONES DIRECCIONALES
===================================================== */

.touch-button {

    width: 55px;

    height: 55px;

    border-radius: 10px;

    background:
        linear-gradient(
            #354d8d,
            #151c4c
        );

    border: 3px solid #67ddff;

    color: white;

    font-size: 25px;

    font-weight: bold;

    display: flex;

    justify-content: center;

    align-items: center;

    user-select: none;

    touch-action: none;

    pointer-events: auto;

    box-shadow:
        0 0 8px #006eff;
}


.touch-button:active,
#fire:active {

    transform: scale(.90);

    filter: brightness(1.4);
}


/* =====================================================
   RESTART
===================================================== */

button#restart {

    margin-top: 7px;

    padding: 8px 25px;

    background: #202b72;

    color: white;

    border: 3px solid #55dfff;

    font-family:
        "Courier New",
        monospace;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 10px #006eff;
}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 700px) {

    h1 {

        margin-top: 4px;

        font-size: 20px;
    }


    #info {

        margin: 3px auto;

        padding: 5px;

        font-size: 12px;
    }


    .energy-container {

        width: 70px;

        height: 10px;
    }


    #game {

        width: 96vw;

        height: 58vh;

        min-height: 300px;

        border-width: 3px;
    }


    #cat {

        width: 65px;

        height: 65px;
    }


    #dog {

        width: 90px;

        height: 90px;
    }


    .shot {

        width: 50px;

        height: 50px;
    }


    #moon {

        width: 65px;

        height: 65px;
    }


    #controls {

        display: none;
    }


    #mobileControls {

        display: block;
    }


    #restart {

        display: none;
    }

}


/* =====================================================
   CELULAR HORIZONTAL
===================================================== */

@media (max-height: 600px) and (orientation: landscape) {

    h1 {

        display: none;
    }


    #info {

        margin: 2px auto;
    }


    #game {

        height: 76vh;
    }


    #mobileControls {

        bottom: 4px;
    }

}

</style>

</head>


<body>


<h1>
🚀 PISPISH LOST IN THE SPACE 🚀
</h1>


<!-- =====================================================
     HUD
===================================================== -->

<div id="info">

    SHOTS:
    <span id="shots">0</span>/13

    &nbsp;&nbsp;

    HITS:
    <span id="hits">0</span>/13

    &nbsp;&nbsp;

    LIVES:
    <span id="lives">3</span> ❤️

    &nbsp;&nbsp;

    ENERGY:

    <span class="energy-container">
        <span id="energy"></span>
    </span>

</div>


<!-- =====================================================
     ESCENARIO
===================================================== -->

<div id="game">


    <div id="moon"></div>


    <div
        id="platform1"
        class="platform"
    ></div>


    <div
        id="platform2"
        class="platform"
    ></div>


    <div
        id="platform3"
        class="platform"
    ></div>


    <!-- GATO -->

    <img
        id="cat"
        src="gato.jpg"
        alt="Gato"
    >


    <!-- BOYERO DE BERNA -->

    <img
        id="dog"
        src="perro.jpg"
        alt="Boyero de Berna"
    >


    <div id="message"></div>

</div>


<!-- =====================================================
     CONTROLES PC
===================================================== -->

<div id="controls">

    ⬅️ ➡️ MOVER

    &nbsp;&nbsp;

    ⬆️ ⬇️ VOLAR

    &nbsp;&nbsp;

    🚀 ESPACIO = DISPARAR

</div>


<!-- =====================================================
     CONTROLES CELULAR
===================================================== -->

<div id="mobileControls">

    <div class="control-row">


        <div class="direction-pad">


            <div
                id="up"
                class="touch-button"
            >
                ⬆️
            </div>


            <div
                id="left"
                class="touch-button"
            >
                ⬅️
            </div>


            <div
                id="down"
                class="touch-button"
            >
                ⬇️
            </div>


            <div
                id="right"
                class="touch-button"
            >
                ➡️
            </div>


        </div>


        <button id="fire">
            FIRE
        </button>


    </div>

</div>


<!-- =====================================================
     RESTART
===================================================== -->

<button
    id="restart"
    onclick="restart()"
>
    ↻ RESTART
</button>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const game =
    document.getElementById("game");

const cat =
    document.getElementById("cat");

const dog =
    document.getElementById("dog");

const shotsText =
    document.getElementById("shots");

const hitsText =
    document.getElementById("hits");

const livesText =
    document.getElementById("lives");

const energy =
    document.getElementById("energy");


/* =====================================================
   VARIABLES
===================================================== */

let shots = 0;

let hits = 0;

let lives = 3;

let gameOver = false;

let invulnerable = false;


/* =====================================================
   POSICIÓN DEL GATO
===================================================== */

let catX = 65;

let catY = 65;

const catSpeed = 5;


/* =====================================================
   TECLADO
===================================================== */

const keys = {};


document.addEventListener(
    "keydown",
    function(event) {

        keys[event.key] = true;


        if (

            event.key === "ArrowUp" ||

            event.key === "ArrowDown" ||

            event.key === "ArrowLeft" ||

            event.key === "ArrowRight" ||

            event.key === " "

        ) {

            event.preventDefault();

        }


        /*
        ESPACIO = DISPARAR
        */

        if (

            event.key === " " &&

            !event.repeat

        ) {

            shoot();

        }

    }
);


document.addEventListener(
    "keyup",
    function(event) {

        keys[event.key] = false;

    }
);


/* =====================================================
   MOVIMIENTO DEL GATO
===================================================== */

function moveCat() {

    if (gameOver) {
        return;
    }


    if (keys["ArrowLeft"]) {

        catX -= catSpeed;

    }


    if (keys["ArrowRight"]) {

        catX += catSpeed;

    }


    if (keys["ArrowUp"]) {

        catY += catSpeed;

    }


    if (keys["ArrowDown"]) {

        catY -= catSpeed;

    }


    /*
    LÍMITES HORIZONTALES
    */

    const maxX =
        game.clientWidth -
        cat.offsetWidth;


    if (catX < 0) {

        catX = 0;

    }


    if (catX > maxX) {

        catX = maxX;

    }


    /*
    LÍMITES VERTICALES
    */

    const maxY =
        game.clientHeight -
        cat.offsetHeight -
        45;


    if (catY < 45) {

        catY = 45;

    }


    if (catY > maxY) {

        catY = maxY;

    }


    cat.style.left =
        catX + "px";


    cat.style.bottom =
        catY + "px";


    /*
    COMPROBAR SI EL PERRO TOCÓ AL GATO
    */

    checkDogCollision();


    requestAnimationFrame(
        moveCat
    );

}


/* =====================================================
   MOVIMIENTO DEL PERRO
===================================================== */

let dogX = 70;

let dogDirection = -1;

let dogSpeed = 2.2;


function moveDog() {

    if (gameOver) {
        return;
    }


    dogX +=
        dogDirection *
        dogSpeed;


    if (dogX < 30) {

        dogDirection = 1;

    }


    if (dogX > 300) {

        dogDirection = -1;

    }


    dog.style.right =
        dogX + "px";


    /*
    COMPROBAR CONTACTO
    */

    checkDogCollision();


    requestAnimationFrame(
        moveDog
    );

}


/* =====================================================
   COLISIÓN PERRO / GATO
===================================================== */

function checkDogCollision() {

    if (
        gameOver ||
        invulnerable
    ) {

        return;

    }


    const catLeft =
        cat.offsetLeft;

    const catRight =
        catLeft +
        cat.offsetWidth;

    const catTop =
        cat.offsetTop;

    const catBottom =
        catTop +
        cat.offsetHeight;


    const dogLeft =
        dog.offsetLeft;

    const dogRight =
        dogLeft +
        dog.offsetWidth;

    const dogTop =
        dog.offsetTop;

    const dogBottom =
        dogTop +
        dog.offsetHeight;


    /*
    DETECTAR CONTACTO
    */

    if (

        catRight > dogLeft &&

        catLeft < dogRight &&

        catBottom > dogTop &&

        catTop < dogBottom

    ) {

        loseLife();

    }

}


/* =====================================================
   QUITAR VIDA AL GATO
===================================================== */

function loseLife() {

    if (
        invulnerable ||
        gameOver
    ) {

        return;

    }


    invulnerable = true;


    lives--;


    livesText.textContent =
        lives;


    /*
    EFECTO VISUAL DEL GATO
    */

    cat.style.filter =
        "brightness(2)";


    cat.style.transform =
        "scale(0.85)";


    /*
    TEXTO DE DAÑO
    */

    const effect =
        document.createElement(
            "div"
        );


    effect.className =
        "damage-effect";


    effect.textContent =
        "-1 ❤️";


    effect.style.left =
        cat.offsetLeft + "px";


    effect.style.top =
        cat.offsetTop - 25 + "px";


    game.appendChild(
        effect
    );


    setTimeout(
        () => {

            effect.remove();

        },
        600
    );


    /*
    SIN VIDAS
    */

    if (lives <= 0) {

        endGame(false);

        return;

    }


    /*
    INVULNERABILIDAD
    */

    let blinkCount = 0;


    const blink =
        setInterval(
            () => {

                if (
                    gameOver
                ) {

                    clearInterval(
                        blink
                    );

                    return;

                }


                cat.style.opacity =
                    cat.style.opacity === "0.3"
                        ? "1"
                        : "0.3";


                blinkCount++;


                if (
                    blinkCount >= 10
                ) {

                    clearInterval(
                        blink
                    );

                    cat.style.opacity =
                        "1";

                }

            },
            100
        );


    /*
    VOLVER A SER VULNERABLE
    */

    setTimeout(
        () => {

            invulnerable = false;

            cat.style.filter =
                "brightness(1)";

            cat.style.transform =
                "scale(1)";

            cat.style.opacity =
                "1";

        },
        1000
    );

}


/* =====================================================
   INICIAR MOVIMIENTO
===================================================== */

moveCat();

moveDog();


/* =====================================================
   DISPARAR
===================================================== */

function shoot() {

    if (
        gameOver ||
        shots >= 13
    ) {

        return;

    }


    shots++;


    shotsText.textContent =
        shots;


    /*
    CREAR PROYECTIL
    */

    const projectile =
        document.createElement(
            "img"
        );


    projectile.className =
        "shot";


    projectile.src =
        "gato.jpg";


    /*
    SALE DESDE EL GATO
    */

    let x =
        cat.offsetLeft +
        cat.offsetWidth;


    let y =
        cat.offsetTop +
        5;


    projectile.style.left =
        x + "px";


    projectile.style.top =
        y + "px";


    game.appendChild(
        projectile
    );


    /*
    MOVIMIENTO DEL PROYECTIL
    */

    const interval =
        setInterval(
            () => {

                x += 14;


                projectile.style.left =
                    x + "px";


                /*
                POSICIÓN DEL PERRO
                */

                const dogLeft =
                    dog.offsetLeft;

                const dogRight =
                    dogLeft +
                    dog.offsetWidth;

                const dogTop =
                    dog.offsetTop;

                const dogBottom =
                    dogTop +
                    dog.offsetHeight;


                /*
                POSICIÓN DEL PROYECTIL
                */

                const shotTop =
                    projectile.offsetTop;

                const shotBottom =
                    shotTop +
                    projectile.offsetHeight;


                /*
                COLISIÓN
                */

                if (

                    x + 65 >= dogLeft &&

                    x <= dogRight &&

                    shotBottom >= dogTop &&

                    shotTop <= dogBottom

                ) {


                    clearInterval(
                        interval
                    );


                    projectile.remove();


                    /*
                    SUMAR IMPACTO
                    */

                    hits++;


                    hitsText.textContent =
                        hits;


                    /*
                    ENERGÍA DEL PERRO
                    */

                    const energyValue =
                        Math.max(
                            0,
                            100 -
                            (
                                hits / 13
                            ) * 100
                        );


                    energy.style.width =
                        energyValue + "%";


                    /*
                    ANIMACIÓN DEL PERRO
                    */

                    dog.style.transform =
                        "translateX(8px) rotate(5deg)";


                    dog.style.filter =
                        "brightness(1.8)";


                    /*
                    EFECTO HIT
                    */

                    const effect =
                        document.createElement(
                            "div"
                        );


                    effect.className =
                        "hit-effect";


                    effect.textContent =
                        "HIT!";


                    effect.style.left =
                        dogLeft + "px";


                    effect.style.top =
                        dogTop - 30 + "px";


                    game.appendChild(
                        effect
                    );


                    setTimeout(
                        () => {

                            effect.remove();

                        },
                        350
                    );


                    /*
                    RESTAURAR PERRO
                    */

                    setTimeout(
                        () => {

                            dog.style.transform =
                                "translateX(0) rotate(0)";

                            dog.style.filter =
                                "brightness(1)";

                        },
                        150
                    );


                    /*
                    GANAR
                    */

                    if (
                        hits >= 13
                    ) {

                        endGame(true);

                    }


                    return;

                }


                /*
                PROYECTIL FUERA
                */

                if (
                    x >
                    game.clientWidth
                ) {


                    clearInterval(
                        interval
                    );


                    projectile.remove();


                    /*
                    SE ACABARON LOS TIROS
                    */

                    if (

                        shots >= 13 &&

                        hits < 13

                    ) {

                        endGame(false);

                    }

                }

            },
            30
        );

}


/* =====================================================
   CONTROLES TÁCTILES
===================================================== */

function addTouchControl(
    elementId,
    key
) {


    const element =
        document.getElementById(
            elementId
        );


    /*
    AL TOCAR
    */

    element.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            keys[key] = true;

        },
        {
            passive: false
        }
    );


    /*
    AL SOLTAR
    */

    element.addEventListener(
        "touchend",
        function(event) {

            event.preventDefault();

            keys[key] = false;

        },
        {
            passive: false
        }
    );


    /*
    SI SE INTERRUMPE EL TOUCH
    */

    element.addEventListener(
        "touchcancel",
        function(event) {

            event.preventDefault();

            keys[key] = false;

        },
        {
            passive: false
        }
    );


    /*
    COMPATIBILIDAD MOUSE
    */

    element.addEventListener(
        "mousedown",
        function() {

            keys[key] = true;

        }
    );


    element.addEventListener(
        "mouseup",
        function() {

            keys[key] = false;

        }
    );


    element.addEventListener(
        "mouseleave",
        function() {

            keys[key] = false;

        }
    );

}


/*
CONTROLES DIRECCIONALES
*/

addTouchControl(
    "up",
    "ArrowUp"
);


addTouchControl(
    "down",
    "ArrowDown"
);


addTouchControl(
    "left",
    "ArrowLeft"
);


addTouchControl(
    "right",
    "ArrowRight"
);


/* =====================================================
   BOTÓN FIRE
===================================================== */

const fireButton =
    document.getElementById(
        "fire"
    );


/*
TOUCH
*/

fireButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        shoot();

    },
    {
        passive: false
    }
);


/*
CLICK
*/

fireButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        shoot();

    }
);


/* =====================================================
   FINAL DEL JUEGO
===================================================== */

function endGame(won) {

    gameOver = true;


    /*
    LIMPIAR TECLAS
    */

    for (
        let key in keys
    ) {

        keys[key] = false;

    }


    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "block";


    if (won) {

        message.innerHTML =

            "★ STAGE CLEAR ★" +

            "<br>" +

            "<small>" +

            "PISPISH WINS!" +

            "</small>";

    }

    else {

        message.innerHTML =

            "GAME OVER" +

            "<br>" +

            "<small>" +

            (
                lives <= 0
                    ? "PISPISH HAS NO LIVES"
                    : "13 SHOTS USED"
            ) +

            "</small>";

    }

}


/* =====================================================
   REINICIAR
===================================================== */

function restart() {

    location.reload();

}
